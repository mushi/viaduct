# Egress-capped Conduit relay (to stay within free-tier data limits),
# build-less: initContainer fetches the checksum-pinned static
# arm64 binary, main container runs it. PVC persists the conduit station identity across restarts
# (keeps broker reputation). Egress bounded at the peak by --bandwidth/--max-common-clients,
# at the monthly total by the host egress-guardrail timer.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: conduit-data, namespace: viaduct }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: conduit, namespace: viaduct }
spec:
  replicas: 1
  strategy: { type: Recreate } # RWO PVC — never two pods at once
  selector: { matchLabels: { app: conduit } }
  template:
    metadata: { labels: { app: conduit } }
    spec:
      securityContext:
        fsGroup: 65532          # PVC + emptyDir group-owned by the non-root conduit uid so it can write /data
      initContainers:
      - name: fetch-conduit
        image: alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf # 3.24.4
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          apk add --no-cache curl >/dev/null
          curl -fsSL -o /shared/conduit https://github.com/Psiphon-Inc/conduit/releases/download/release-cli-2.1.0/conduit-linux-arm64
          echo "41d33d3a7c6288a4ae62c17f01d0667034d8757c26259e338a22544701528227  /shared/conduit" | sha256sum -c -
          chmod +x /shared/conduit
        resources:
          requests: { memory: 32Mi, cpu: 50m }
          limits: { memory: 128Mi, cpu: 200m }
        securityContext:
          # apk needs default caps (chown on package install), so caps are not
          # dropped here; escalation is still blocked and seccomp enforced.
          allowPrivilegeEscalation: false
          seccompProfile: { type: RuntimeDefault }
        volumeMounts: [{ name: shared, mountPath: /shared }]
      containers:
      - name: conduit
        image: alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf # 3.24.4
        command: ["/shared/conduit", "start", "--data-dir", "/data", "--bandwidth", "15", "--max-common-clients", "5", "--metrics-addr", ":9090"]
        ports: [{ name: metrics, containerPort: 9090 }]
        resources:
          requests: { memory: 64Mi, cpu: 100m }
          limits: { memory: 256Mi, cpu: 500m }
        livenessProbe:
          tcpSocket: { port: 9090 }
          initialDelaySeconds: 30
          periodSeconds: 30
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532       # arbitrary non-zero uid; conduit needs no root (no privileged ports)
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          seccompProfile: { type: RuntimeDefault }
        volumeMounts:
        - { name: shared, mountPath: /shared }
        - { name: data, mountPath: /data }
      volumes:
      - { name: shared, emptyDir: {} }
      - { name: data, persistentVolumeClaim: { claimName: conduit-data } }
---
apiVersion: v1
kind: Service
metadata: { name: conduit-metrics, namespace: viaduct }
spec:
  selector: { app: conduit }
  ports: [{ name: metrics, port: 9090, targetPort: 9090 }]
