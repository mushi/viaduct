# Namespaces + RBAC for the AWS node.
# spire ns: SA for the host agent's k8s WorkloadAttestor (kubelet /pods). startup.sh
# mints a short-lived SA token (kubectl create token, 24h)
# into /opt/spire/conf/agent/k8s-sa-token and a systemd timer rotates it.
# The ClusterRole below is what the minted token carries (read-only pods/nodes).
# viaduct ns: workloads (conduit, alloy). SA vault-agent maps via a SPIRE entry to
#   spiffe://viaduct.aws/vault-agent, which GCP Vault's cert-auth trusts.
---
apiVersion: v1
kind: Namespace
metadata: { name: spire }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: spire-agent, namespace: spire }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: spire-agent-kubelet }
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "nodes/proxy"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: spire-agent-kubelet }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: spire-agent-kubelet }
subjects:
- { kind: ServiceAccount, name: spire-agent, namespace: spire }
---
apiVersion: v1
kind: Namespace
metadata: { name: viaduct }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: vault-agent, namespace: viaduct }
