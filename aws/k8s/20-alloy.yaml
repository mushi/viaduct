# Grafana Alloy: scrapes Conduit (:9090) + host metrics (unix exporter: netdev +
# the egress-guardrail textfile), remote_writes to Grafana Cloud tagged node="aws".
#
# Grafana token is fetched cross-cloud from GCP Vault at startup
# and writes the Alloy config (token inline) to a RAM-only volume
# (emptyDir medium:Memory). Token is long-lived, so
# the SVID is only needed at startup, so no continuous vault-agent sidecar needed.
#
# Alloy runs in the viaduct-obs namespace, not viaduct: its hostPath mounts (/proc, /sys,
# the textfile dir, journald) are forbidden by the Pod Security 'baseline' profile that
# viaduct enforces for conduit. See 00-namespaces-rbac.yaml for why the exemption is scoped
# to this namespace. It still scrapes conduit across the namespace boundary via the
# conduit-metrics service FQDN, which the NetworkPolicies at the bottom of this file allow.
#
# __GCP_CONTROL_PLANE_IP__ is substituted by startup.sh (real IP kept out of the repo).
# The init container fetches GCP Vault's cert itself over the mesh (WireGuard authenticates
# the peer), so there is no vault-ca ConfigMap to maintain. Depends on the
# spiffe://viaduct.aws/vault-agent SPIRE entry (host-created at deploy).
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alloy, namespace: viaduct-obs }
spec:
  replicas: 1
  selector: { matchLabels: { app: alloy } }
  template:
    metadata: { labels: { app: alloy } }
    spec:
      serviceAccountName: vault-agent
      securityContext:
        runAsUser: 0
        seccompProfile: { type: RuntimeDefault }
      initContainers:
      - name: fetch-svid
        image: ghcr.io/spiffe/spire-agent@sha256:501ea7072748adb74d1f9ac3320ddceedcf3b8c4a1cc9d2b4bedd427d277475b # 1.15.1
        command: ["/opt/spire/bin/spire-agent", "api", "fetch", "x509", "-socketPath", "/spiffe-workload-api/api.sock", "-write", "/svids"]
        resources:
          requests: { memory: 32Mi, cpu: 50m }
          limits: { memory: 64Mi, cpu: 200m }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        volumeMounts:
        - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
        - { name: svids, mountPath: /svids }
      # Fetch this node's secret from GCP Vault using its SPIRE SVID (cert auth) over the
      # mesh, and render Alloy's config with it. The AWS analog of Hetzner's
      # fetch-hetzner-secrets.sh: establish trust (fetch GCP's cert over the mesh) ->
      # authenticate (SVID) -> fetch (kv/aws/grafana) -> render.
      - name: vault-fetch
        image: hashicorp/vault@sha256:3fd53308acccd9e4e83fde3e6c6cf5b15e0f7fac1ff7510780b8b23f5e4c3de7 # 2.0.2
        env:
        - { name: VAULT_ADDR, value: "https://__GCP_CONTROL_PLANE_IP__:8200" }
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          # The vault image (Alpine) has no openssl; add it to fetch GCP's cert.
          apk add --no-cache openssl >/dev/null
          # Fetch GCP Vault's current listener cert over the mesh. WireGuard authenticates
          # the peer, so this trust-on-first-use is sound and always current (it rotates on
          # a GCP rebuild). No pinned fingerprint, no vault-ca ConfigMap.
          #
          # But fetching the cert from the endpoint it then verifies is a tautology on its
          # own: whatever answers is trusted, and the SVID client cert is handed to it. The
          # listener cert carries the control-plane mesh IP in its SANs (see gcp/outputs.tf),
          # so require that before using it as the CA. A pod cannot source
          # scripts/lib/mesh-trust.sh, so the check is inlined here; keep it in step with
          # vh_verify_cert_san.
          openssl s_client -connect __GCP_CONTROL_PLANE_IP__:8200 </dev/null 2>/dev/null | openssl x509 > /tmp/vault-ca.crt
          if ! openssl x509 -in /tmp/vault-ca.crt -noout -checkend 0 >/dev/null 2>&1; then
            echo "ERROR: control-plane certificate is empty, unparseable or expired; refusing to use it as the Vault CA" >&2
            exit 1
          fi
          if ! openssl x509 -in /tmp/vault-ca.crt -noout -ext subjectAltName 2>/dev/null \
               | grep -qE "IP Address:__GCP_CONTROL_PLANE_IP__([^0-9]|$)"; then
            echo "ERROR: certificate served at __GCP_CONTROL_PLANE_IP__:8200 does not list that IP in its subjectAltName; refusing to present the SVID to it" >&2
            exit 1
          fi
          export VAULT_CACERT=/tmp/vault-ca.crt
          vault login -method=cert -client-cert=/svids/svid.0.pem -client-key=/svids/svid.0.key name=aws-vault-agent >/dev/null
          U=$(vault kv get -field=prometheus_user kv/aws/grafana)
          K=$(vault kv get -field=api_key kv/aws/grafana)
          URL=$(vault kv get -field=prometheus_url kv/aws/grafana)
          LURL=$(vault kv get -field=loki_url kv/aws/grafana)
          LU=$(vault kv get -field=loki_user kv/aws/grafana)
          # These three go unescaped into the River heredoc below, which Alloy then
          # parses as configuration — and River configuration can declare components,
          # so a value carrying a quote or a newline does not merely break the render,
          # it adds directives (an extra remote_write shipping this node's metrics
          # elsewhere, for one). Validate before interpolating, and refuse to render
          # rather than render something unintended.
          vh_reject() {
            echo "ERROR: $1 from kv/aws/grafana is empty or carries characters that" >&2
            echo "       would close the River string; refusing to render config.alloy" >&2
            exit 1
          }
          vh_check() {  # name value extended-regex
            [ -n "$2" ] || vh_reject "$1"
            # grep matches line by line, so a value with an embedded newline could pass
            # on each line while still injecting a directive. Reject multi-line first.
            [ "$(printf '%s' "$2" | wc -l)" -eq 0 ] || vh_reject "$1"
            printf '%s' "$2" | grep -qE "$3" || vh_reject "$1"
          }
          vh_check prometheus_url  "$URL"  '^https://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$'
          vh_check prometheus_user "$U"    '^[A-Za-z0-9._@-]+$'
          vh_check api_key         "$K"    '^[A-Za-z0-9._=+/-]+$'
          vh_check loki_url        "$LURL" '^https://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$'
          vh_check loki_user       "$LU"   '^[A-Za-z0-9._@-]+$'
          cat > /rendered/config.alloy <<CFG
          prometheus.exporter.unix "node" {
            procfs_path    = "/host/proc"
            sysfs_path     = "/host/sys"
            set_collectors = ["netdev","meminfo","loadavg","textfile"]
            textfile { directory = "/host/textfile" }
          }
          prometheus.scrape "node" {
            targets    = prometheus.exporter.unix.node.targets
            forward_to = [prometheus.remote_write.grafana.receiver]
            job_name   = "node"
          }
          prometheus.scrape "conduit" {
            targets    = [{"__address__" = "conduit-metrics.viaduct.svc.cluster.local:9090"}]
            forward_to = [prometheus.remote_write.grafana.receiver]
            job_name   = "conduit"
          }
          prometheus.remote_write "grafana" {
            endpoint {
              url = "$URL"
              basic_auth {
                username = "$U"
                password = "$K"
              }
            }
            external_labels = { node = "aws" }
          }

          // ── Logs: host journald → Grafana Cloud Loki ──────────────────────
          // The AWS node's journald (mounted read-only) carries the interesting
          // security-relevant records: spire-server, k3s, and SSM/sshd sessions.
          // The rules below are consumed by loki.source.journal's `relabel_rules` argument, NOT
          // forwarded. Journal fields arrive as internal __journal_* labels, and Alloy drops every
          // __-prefixed label before handing entries to `forward_to` — so a loki.relabel component
          // chained downstream sees none of them and silently produces nothing. That is exactly what
          // happened here: Loki held only {job, node} and every unit/level panel read "No data".
          // forward_to = [] is deliberate and is what the upstream example specifies.
          loki.relabel "journal" {
            forward_to = []
            rule {
              source_labels = ["__journal__systemd_unit"]
              target_label  = "unit"
            }
            rule {
              source_labels = ["__journal_priority_keyword"]
              target_label  = "level"
            }
          }
          loki.source.journal "host" {
            path          = "/host/journal"
            forward_to    = [loki.write.grafana.receiver]
            relabel_rules = loki.relabel.journal.rules
            labels        = { job = "systemd-journal" }
            max_age       = "12h"
          }

          // ── OTLP receiver (localhost only); logs now, traces later ─────────
          otelcol.receiver.otlp "default" {
            grpc { endpoint = "127.0.0.1:4317" }
            http { endpoint = "127.0.0.1:4318" }
            output { logs = [otelcol.exporter.loki.default.input] }
          }
          otelcol.exporter.loki "default" {
            forward_to = [loki.write.grafana.receiver]
          }

          loki.write "grafana" {
            external_labels = { node = "aws" }
            endpoint {
              url = "$LURL"
              basic_auth {
                username = "$LU"
                password = "$K"
              }
            }
          }
          CFG
          echo "rendered config.alloy"
        resources:
          requests: { memory: 32Mi, cpu: 50m }
          limits: { memory: 128Mi, cpu: 200m }
        securityContext:
          allowPrivilegeEscalation: false
          # apk add (package extraction: chown/mode the unpacked files) needs these back;
          # everything else stays dropped. This init container is short-lived (fetch + render).
          capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID] }
        volumeMounts:
        - { name: svids, mountPath: /svids }
        - { name: rendered, mountPath: /rendered }
      containers:
      - name: alloy
        image: grafana/alloy@sha256:ab04df3936e4d71d31b6f55e0c58a7e749091f59635dd8c2bc731ba1b6c93701 # v1.8.3
        # Loopback, not 0.0.0.0. Inside the pod netns 0.0.0.0 resolves to the pod IP,
        # which any process in the NODE's netns can dial — and kube-router does not
        # filter node-originated traffic to a local pod, so the NetworkPolicy below
        # never covered that path. On loopback the admin API is reachable only from
        # inside this pod. `kubectl port-forward` still works: it enters the pod netns.
        #
        # pprof off as well. /debug/pprof/heap dumps process memory, and the rendered
        # config carries the Grafana Cloud basic_auth password in plaintext, so a heap
        # dump is a credential disclosure. It defaults to true.
        args:
        - "run"
        - "/rendered/config.alloy"
        - "--storage.path=/tmp/alloy"
        - "--server.http.listen-addr=127.0.0.1:12345"
        - "--server.http.enable-pprof=false"
        resources:
          requests: { memory: 96Mi, cpu: 100m }
          limits: { memory: 256Mi, cpu: 500m }
        # A tcpSocket probe dials the POD IP, which is exactly the reachability being
        # removed above, so the check has to run inside the pod instead. bash's
        # /dev/tcp opens the connection without needing an HTTP client — the image has
        # /usr/bin/bash but ships neither curl nor wget.
        livenessProbe:
          exec:
            command: ["/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345"]
          initialDelaySeconds: 30
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        volumeMounts:
        - { name: rendered, mountPath: /rendered }
        - { name: alloy-tmp, mountPath: /tmp/alloy }
        - { name: host-proc, mountPath: /host/proc, readOnly: true }
        - { name: host-sys, mountPath: /host/sys, readOnly: true }
        - { name: host-txt, mountPath: /host/textfile, readOnly: true }
        - { name: host-journal, mountPath: /host/journal, readOnly: true }
      volumes:
      - { name: spiffe-workload-api, csi: { driver: csi.spiffe.io, readOnly: true } }
      - { name: svids, emptyDir: { medium: Memory } }
      - { name: rendered, emptyDir: { medium: Memory } }
      - { name: alloy-tmp, emptyDir: {} }
      - { name: host-proc, hostPath: { path: /proc } }
      - { name: host-sys, hostPath: { path: /sys } }
      - { name: host-txt, hostPath: { path: /var/lib/viaduct-textfile } }
      # Persistent journald dir (startup.sh.tpl ensures /var/log/journal exists), so
      # Alloy can ship spire-server / k3s / sshd records to Loki. Read-only.
      - { name: host-journal, hostPath: { path: /var/log/journal } }
---
# Default-deny ingress in both namespaces. Alloy's HTTP server (:12345) serves its admin
# UI and API; nothing in the cluster needs to reach it, and without a policy every pod on
# the cluster network could. Alloy is outbound-only in normal operation: it scrapes
# conduit-metrics:9090 (cross-namespace) and remote-writes to Grafana.
#
# The listener is now on 127.0.0.1 (see the container args), so this policy is no longer
# the only thing standing between the cluster and the admin API — it is defence in depth
# for both namespaces, and it is what confines conduit's metrics port.
#
# The probe no longer depends on this policy either: it runs inside the pod via
# bash /dev/tcp rather than being dialled by the kubelet, so the CNI's treatment of
# node-originated traffic no longer affects whether the pod stays Ready.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: viaduct }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: viaduct-obs }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The one ingress the workload namespace genuinely needs: Alloy scraping Conduit's metrics
# port. Alloy now lives in viaduct-obs, so a bare podSelector no longer matches it — a
# podSelector is namespace-local, and without the namespaceSelector this policy would
# select nothing and the scrape would be dropped by the default-deny above. The label is
# the one the API server sets on every namespace automatically (k8s >= 1.21), so it cannot
# be spoofed by relabelling.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-alloy-scrape-conduit, namespace: viaduct }
spec:
  podSelector:
    matchLabels: { app: conduit }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: viaduct-obs }
      podSelector:
        matchLabels: { app: alloy }
    ports:
    - { protocol: TCP, port: 9090 }
